name: release-matrix
# Keeps docs/docs/history/releases/release-matrix.md in step with the actual
# releases of each product. Opens a PR rather than pushing to main, so a human
# still sees what changed.
#
# The page went four months stale while hand-maintained; this is what stops
# that from happening again. See aerospike-ce-ecosystem/project-hub#156.

on:
  # 07:30 KST daily (= 22:30 UTC), shortly after the product repos'
  # daily-release workflows cut their tags at 22:00 UTC.
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      open_pr:
        description: 'Open a PR (default). If false, only report the diff.'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-matrix
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Regenerate the matrix
        # Reads public release metadata plus workspace's submodule pins across
        # the org. Prefer ORG_READ_TOKEN when available for the same reason
        # weekly-pr-stats does — the repo-scoped GITHUB_TOKEN may not be able
        # to read sibling repos under strict org policies.
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/generate-release-matrix.mjs

      - name: Verify the result passes the freshness checks
        run: node scripts/check-release-matrix.mjs

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- docs/docs/history/releases/release-matrix.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No release changes since the last run — skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- docs/docs/history/releases/release-matrix.md
          fi

      - name: Summary
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            echo "## Release Matrix"
            echo ""
            echo "Updated \`docs/docs/history/releases/release-matrix.md\`."
            echo ""
            echo "<details><summary>diff</summary>"
            echo ""
            echo '```diff'
            git diff -- docs/docs/history/releases/release-matrix.md | head -200
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR (default)
        if: |
          steps.changes.outputs.changed == 'true' &&
          (github.event_name == 'schedule' || inputs.open_pr != false)
        # Pinned to a commit SHA per OpenSSF Scorecard guidance.
        # SHA = peter-evans/create-pull-request v8.1.1.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/release-matrix
          base: main
          delete-branch: true
          commit-message: 'docs(release-matrix): refresh current releases'
          title: 'docs(release-matrix): refresh current releases'
          body: |
            ## Release matrix refresh

            Opened automatically by the `release-matrix` workflow.

            - Source: `node scripts/generate-release-matrix.mjs`
            - Output: `docs/docs/history/releases/release-matrix.md`
            - Schedule: daily at 22:30 UTC

            Only the block between the `BEGIN GENERATED` / `END GENERATED`
            markers and the `last_updated:` frontmatter field are rewritten.
            The hand-maintained Cross-Project Compatibility Matrix below them
            is untouched — add a row there yourself when you actually run an
            integration test.
          labels: |
            automation
            documentation
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'

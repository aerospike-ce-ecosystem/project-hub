name: Check Docs Build
# PR에서 docs/ 변경 시 Docusaurus 빌드 검증 (배포하지 않음)

on:
  pull_request:
    paths: ['docs/**', 'scripts/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
